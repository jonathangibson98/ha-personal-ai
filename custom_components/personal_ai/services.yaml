search_models:
  fields:
    query:
      required: true
      example: llama
      selector:
        text:
    source:
      default: all
      selector:
        select:
          options: [all, ollama, hf]
    config_entry:
      selector:
        config_entry:
          integration: personal_ai
pull_model:
  fields:
    model:
      required: true
      example: llama3.1:8b
      selector:
        text:
    config_entry:
      selector:
        config_entry:
          integration: personal_ai
add_api_key:
  fields:
    provider:
      required: true
      example: groq
      selector:
        text:
    key:
      required: true
      selector:
        text:
          type: password
    base_url:
      example: https://api.example.com/v1
      selector:
        text:
          type: url
    config_entry:
      selector:
        config_entry:
          integration: personal_ai
