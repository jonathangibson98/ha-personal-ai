configuration:
  proxy_key:
    name: Proxy key
    description: The API key apps must send to use the gateway. Leave empty to have one generated (shown in the gateway's Settings).
  admin_password:
    name: Admin password
    description: Optional password for the management API outside Home Assistant. Empty means the proxy key.
  ollama_url:
    name: Ollama address (optional)
    description: Only if you run Ollama somewhere, e.g. http://192.168.1.50:11434. Leave empty and nothing about Ollama shows up. You can also set it on the gateway page.
  ollama_preload:
    name: Download on start
    description: Comma-separated Ollama model names to download automatically, for example llama3.1:8b,qwen3:4b.
  api_keys:
    name: API keys
    description: Provider keys. Add the same provider several times to rotate between keys. Provider names such as gemini, openai, groq, openrouter, mistral. More can be added in the gateway page.
  wallpaper:
    name: Wallpaper
    description: >-
      Background image for this add-on's web UI. Leave empty to use your Home Assistant theme's wallpaper, "none" for no wallpaper, or an image: put it in /config/www and enter its file name (pic.jpg) or /local/pic.jpg, or a full https:// link.
network:
  8000/tcp: "OpenAI-compatible API (apps send the proxy key) and MCP servers on your network"
