configuration:
  proxy_key:
    name: Proxy key
    description: The API key apps must send to use the gateway. Leave empty to have one generated (shown in the gateway's Settings).
  admin_password:
    name: Admin password
    description: Optional password for the management API outside Home Assistant. Empty means the proxy key.
  ollama_url:
    name: Ollama address
    description: Optional starting value. LAN address of the machine running Ollama, for example http://192.168.1.50:11434 (not localhost). You can also set and test it on the gateway page, which takes priority.
  ollama_preload:
    name: Download on start
    description: Comma-separated Ollama model names to download automatically, for example llama3.1:8b,qwen3:4b.
  api_keys:
    name: API keys
    description: Provider keys. Add the same provider several times to rotate between keys. Provider names such as gemini, openai, groq, openrouter, mistral. More can be added in the gateway page.
network:
  8000/tcp: OpenAI-compatible API (apps must send the proxy key)
