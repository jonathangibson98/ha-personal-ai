name: Personal AI Gateway
version: "2.0.2"
slug: personal_ai_gateway
image: "ghcr.io/jonathangibson98/{arch}-addon-personal_ai_gateway"
description: One OpenAI-compatible endpoint for your AI keys and Claude/ChatGPT/Gemini account sign-in, MCP servers (with an HTTPS address) for your devices, computers and tools, and Open WebUI chat
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true
hassio_api: true
startup: services
boot: auto
ingress: true
ingress_port: 8000
panel_icon: mdi:router-network
panel_title: AI Gateway
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: "OpenAI-compatible API (apps send the proxy key) and MCP servers (/mcp/<key>)"
backup_exclude:
  - /data/cli/npm/**
map:
  - share:rw
options:
  proxy_key: ""
  admin_password: ""
  ollama_url: ""
  ollama_preload: ""
  api_keys: []
  wallpaper: ""
schema:
  proxy_key: password?
  admin_password: password?
  ollama_url: str?
  ollama_preload: str?
  api_keys:
    - provider: str
      key: password
  wallpaper: str?
