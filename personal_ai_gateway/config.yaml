name: Personal AI Gateway
version: "1.0.0"
slug: personal_ai_gateway
image: "ghcr.io/jonathangibson98/{arch}-addon-personal_ai_gateway"
description: One OpenAI-compatible endpoint for all your AI keys and your own downloaded models, with key rotation, fallback routes and a model search
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8000
panel_icon: mdi:router-network
panel_title: AI Gateway
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: OpenAI-compatible API (apps must send the proxy key)
options:
  proxy_key: ""
  admin_password: ""
  ollama_url: "http://172.30.32.1:11434"
  ollama_preload: ""
  api_keys: []
schema:
  proxy_key: password?
  admin_password: password?
  ollama_url: str?
  ollama_preload: str?
  api_keys:
    - provider: str
      key: password
