# Personal AI Gateway + Open WebUI (chat), as one stack.
#   1. cp .env.example .env and set PROXY_API_KEY (any long random text), plus any API keys
#   2. docker compose up -d
#   3. gateway: http://<this-machine>:8000 (sign in with the proxy key)
#      chat:    http://<this-machine>:3000 (the first account you create is the admin)
# Update:  docker compose pull && docker compose up -d
services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.standalone
    # Prebuilt by GitHub Actions on every push.
    image: ghcr.io/jonathangibson98/personal-ai-gateway:latest
    container_name: personal_ai_gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      OPEN_WEBUI_PORT: "3000"   # lets the gateway's Chat tab open Open WebUI
      # Optional: an Ollama you already run somewhere (nothing about Ollama shows without it).
      # OLLAMA_URL: http://192.168.1.50:11434
      # MCP tab, Home Assistant devices: your HA address and a long-lived access token.
      # HA_URL: http://homeassistant.local:8123
      # HA_TOKEN: your-long-lived-token
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data   # providers, keys you add in the page, MCP servers, usage counters

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: gateway_open_webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      OPENAI_API_BASE_URL: http://gateway:8000/v1
      OPENAI_API_KEY: ${PROXY_API_KEY:?Set PROXY_API_KEY in .env so Open WebUI can use the gateway}
      ENABLE_OLLAMA_API: "False"
      WEBUI_NAME: AI Gateway Chat
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
    volumes:
      - open_webui:/app/backend/data   # chats, users, settings
    depends_on:
      - gateway

volumes:
  open_webui:
