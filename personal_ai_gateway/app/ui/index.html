<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Personal AI Gateway</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI Gateway">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1015">
<style>
/* Personal AI Gateway — own look when opened directly; inside Home Assistant the theme script
   (further down) maps these colors to your HA theme (wallpaper and glass cards included). */
:root{
  --bg:#f4f5f7; --bg2:#e9ecf2; --panel:#ffffff; --ink:#15181d; --muted:#6a7280; --line:#e2e5ec;
  --accent:#4f6bff; --accent2:#8a5cff; --accent-ink:#fff;
  --ready:#1fb87a; --cooling:#f2a31b; --locked:#ef5a4a; --off:#a7adb8; --danger:#d9443a;
  --sans:ui-rounded,"SF Pro Rounded","SF Pro Text",-apple-system,"Segoe UI",system-ui,Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:18px; --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1015; --bg2:#151821; --panel:#171a23; --ink:#eef0f5; --muted:#9097a6; --line:#262a36;
        --accent:#7c8dff; --accent2:#b28cff; --accent-ink:#0b0d14;
        --ready:#3ddc97; --cooling:#ffc04d; --locked:#ff7a6b; --off:#5a6170; --danger:#ff8a7a;
        --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25)}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 600px at 10% -10%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 60%),var(--bg);
  color:var(--ink);font:15.5px/1.5 var(--sans);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:12px;padding:14px 18px 6px;max-width:980px;width:100%;margin:0 auto}
.logo{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.logo svg{width:22px;height:22px;fill:currentColor}
h1{font-size:1.15rem;margin:0;font-weight:750;letter-spacing:-.01em;line-height:1.2}
header small{color:var(--muted);font-size:.78rem}
.pill{margin-left:auto;font-size:.75rem;font-weight:650;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--ready);border-color:color-mix(in srgb,var(--ready) 40%,transparent);background:color-mix(in srgb,var(--ready) 10%,transparent)}
.pill.warn{color:var(--cooling);border-color:color-mix(in srgb,var(--cooling) 40%,transparent);background:color-mix(in srgb,var(--cooling) 10%,transparent)}
main{flex:1;overflow-y:auto;padding:6px 18px 28px;max-width:980px;width:100%;margin:0 auto;scroll-behavior:smooth}
/* tabs: a floating bar at the bottom on phones, a segmented bar under the header on wide screens */
nav{display:grid;grid-template-columns:repeat(var(--n,7),1fr);gap:2px;background:color-mix(in srgb,var(--panel) 88%,transparent);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid var(--line);border-radius:22px;margin:0 10px calc(10px + env(safe-area-inset-bottom));padding:5px;box-shadow:var(--shadow);order:3}
nav button{background:none;border:0;border-radius:16px;padding:7px 2px 6px;font:inherit;font-size:.68rem;font-weight:600;color:var(--muted);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;transition:background .15s,color .15s}
nav svg{width:21px;height:21px;fill:currentColor}
nav button:hover{color:var(--ink)}
nav button span.short{display:none}
nav button[aria-current=page]{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
header{order:0}main{order:2}
@media (min-width:820px){
  nav{order:1;max-width:944px;width:calc(100% - 36px);margin:6px auto 4px;display:flex;border-radius:16px}
  nav button{flex:1;flex-direction:row;justify-content:center;gap:7px;font-size:.86rem;padding:9px 6px;border-radius:12px}
  nav svg{width:18px;height:18px}
}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}
h2{font-size:.8rem;margin:22px 4px 8px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:12px 0;box-shadow:var(--shadow)}
.card.hero{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 9%,var(--panel)),var(--panel) 55%)}
.card h3{margin:0 0 6px;font-size:1.02rem;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;letter-spacing:-.005em}
details.card>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"›";margin-left:auto;color:var(--muted);font-size:1.3rem;transition:transform .2s}
details.card[open]>summary::after{transform:rotate(90deg)}
details.card[open]>summary{margin-bottom:8px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:.88rem}
p{margin:6px 0}
.mono{font-family:var(--mono);font-size:.82rem;overflow-wrap:anywhere}
button.b,a.b{font:inherit;font-size:.88rem;font-weight:600;border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:12px;padding:8px 14px;
  cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:transform .08s,filter .15s,background .15s}
button.b:hover,a.b:hover{filter:brightness(1.04)}
button.b:active,a.b:active{transform:scale(.97)}
button.b.p,a.b.p{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);border-color:transparent;
  box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 30%,transparent)}
button.b.d{color:var(--danger);background:color-mix(in srgb,var(--danger) 8%,transparent);border-color:color-mix(in srgb,var(--danger) 25%,transparent)}
button.b:disabled{opacity:.5;cursor:default;transform:none}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-width:100%;
  transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
input[type=text],input[type=password],input[type=search],input:not([type]),textarea,select{width:100%}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}
textarea{min-height:84px;font-family:var(--mono);font-size:.88rem}
label.f{display:block;margin:12px 2px 5px;font-size:.82rem;font-weight:600;color:var(--muted)}
.lamp{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--off);flex:none}
.lamp.ready{background:var(--ready);box-shadow:0 0 0 3px color-mix(in srgb,var(--ready) 22%,transparent)}
.lamp.cooling{background:var(--cooling);box-shadow:0 0 0 3px color-mix(in srgb,var(--cooling) 22%,transparent)}
.lamp.locked{background:var(--locked);box-shadow:0 0 0 3px color-mix(in srgb,var(--locked) 22%,transparent)}
.chip{font-size:.72rem;font-weight:600;border-radius:99px;padding:2px 9px;color:var(--muted);background:var(--bg2);border:1px solid var(--line);white-space:nowrap}
.sub{display:flex;gap:4px;margin:12px 0;padding:4px;background:var(--bg2);border:1px solid var(--line);border-radius:14px}
.sub button{flex:1;font:inherit;font-size:.86rem;font-weight:600;padding:8px;border:0;background:none;color:var(--muted);border-radius:10px;cursor:pointer}
.sub button[aria-pressed]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0}
.tile{font:inherit;text-align:left;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);
  color:var(--ink);display:flex;flex-direction:column;gap:2px;transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.tile b{font-size:.95rem}
.tile span{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin:12px 0 4px}
.choice{font:inherit;text-align:left;cursor:pointer;background:var(--bg2);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.choice b{font-size:.9rem}
.choice span{font-size:.78rem;color:var(--muted)}
.choice[aria-pressed]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
.status{border-radius:12px;padding:9px 12px;font-size:.88rem;font-weight:600;margin:10px 0}
.status.good{background:color-mix(in srgb,var(--ready) 12%,transparent);color:var(--ready)}
.status.warn{background:color-mix(in srgb,var(--cooling) 14%,transparent);color:var(--cooling)}
.status.bad{background:color-mix(in srgb,var(--locked) 12%,transparent);color:var(--locked)}
.status .mono{color:var(--ink)}
ol.steps{margin:8px 0;padding-left:20px;font-size:.86rem;color:var(--muted)}
ol.steps li{margin:3px 0}
iframe.owui{width:100%;height:calc(100vh - 230px);min-height:520px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow)}
.meter{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;height:12px;margin:8px 0 4px}
.meter i{background:var(--line);border-radius:3px}
.meter i.on{background:linear-gradient(var(--ready),color-mix(in srgb,var(--ready) 70%,#000))}
.keyrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.keyrow:first-of-type{border-top:0}
.note{padding:11px 14px;border-radius:12px;background:color-mix(in srgb,var(--cooling) 14%,var(--panel));font-size:.88rem;margin:10px 0;border:1px solid color-mix(in srgb,var(--cooling) 25%,transparent)}
.err{color:var(--danger)}
pre.term{background:#0b0d12;color:#d7dde8;border-radius:12px;padding:12px;font:12px/1.45 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;max-height:320px;overflow-y:auto;margin:8px 0}
details.dev{border-top:1px solid var(--line);padding:8px 0}
details.dev summary{cursor:pointer;display:flex;gap:8px;align-items:center;list-style:none}
details.dev summary::-webkit-details-marker{display:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none;background:var(--bg2)}
.seg button{font:inherit;font-size:.76rem;font-weight:600;border:0;background:none;color:var(--muted);padding:5px 9px;cursor:pointer}
.seg button[aria-pressed]{background:var(--accent);color:var(--accent-ink)}
.ok{color:var(--ready)}
#chatlog{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.m{padding:10px 14px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:88%;line-height:1.45}
.m.u{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);border-bottom-right-radius:6px}
.m.a{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:var(--shadow)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;
  border-radius:14px;font-size:.88rem;font-weight:600;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:20}
#toast.err{background:var(--danger);color:#fff}
@media (prefers-reduced-motion:no-preference){.lamp.cooling{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}
  main>div>*{animation:rise .25s ease both}@keyframes rise{from{opacity:0;transform:translateY(4px)}}}

/* ---------- sign-in ---------- */
#login{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px calc(20px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
  background:radial-gradient(900px 500px at 50% -10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%),var(--bg);overflow-y:auto}
#login[hidden]{display:none}
body.signed-out header,body.signed-out nav,body.signed-out main{visibility:hidden}
.login-card{width:100%;max-width:390px;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:28px 22px 22px;box-shadow:var(--shadow);text-align:center}
.login-card h1{font-size:1.35rem;margin:14px 0 4px}
.login-card label.f{text-align:left;margin-top:18px}
.logo.big{width:62px;height:62px;border-radius:19px;margin:0 auto}
.logo.big svg{width:34px;height:34px}
.pwrow{display:flex;gap:8px}
.pwrow input{flex:1;min-width:0}
.switch{display:flex;align-items:center;gap:12px;text-align:left;margin:16px 2px 4px;cursor:pointer;flex-wrap:wrap}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch span{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked+span{background:var(--ready)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}
.switch b{font-size:.92rem}
.switch small{color:var(--muted);font-size:.78rem;flex-basis:100%;margin:-8px 0 0 58px}
#loginerr{min-height:1.3em;margin:10px 0 6px;font-size:.88rem;font-weight:600}
.b.wide{width:100%;justify-content:center;padding:12px;font-size:1rem}
/* ---------- phones ---------- */
body{height:100dvh}
@media (max-width:640px){
  header{padding:10px 14px 4px}
  .logo{width:34px;height:34px;border-radius:11px}
  h1{font-size:1.05rem}
  main{padding:4px 12px 16px}
  .card{padding:14px;border-radius:16px;margin:10px 0}
  button.b,a.b{min-height:42px;padding:9px 14px;justify-content:center}
  .card .row>.b,.card .row>a.b{flex:1 1 auto}
  .row{gap:8px}
  .seg button{padding:8px 10px;font-size:.8rem}
  .choices,.tiles{grid-template-columns:1fr 1fr}
  .tile{padding:12px}
  .keyrow{gap:8px}
  .mono{font-size:.78rem}
  input,select,textarea{padding:11px 12px}
  nav{display:flex;gap:0;margin:0 6px calc(6px + env(safe-area-inset-bottom));padding:4px}
  nav button{flex:1 1 0;min-width:0;min-height:52px;padding:6px 0 5px;font-size:.62rem;letter-spacing:-.01em}
  nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  nav button span.long{display:none}
  nav button span.short{display:inline}
  iframe.owui{height:calc(100dvh - 210px);min-height:420px}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  details.card>summary{min-height:28px}
  input[type=checkbox]{width:22px;height:22px}
}
@media (max-width:380px){.choices,.tiles{grid-template-columns:1fr}}
</style>
</head>

<!-- ha-theme v1.2.0: copied from .shared/ha-theme.js, edit it there -->
<script>
window.__hbAddon = "personal_ai_gateway";
/* HA Theme Bridge v1.2.0
 * Makes an add-on web UI follow the active Home Assistant theme (colors, dark/light,
 * dashboard wallpaper, glass blur, card corners and shadows) and updates live when
 * the theme changes. It reads the theme from the Home Assistant page that holds the
 * add-on (ingress runs on the same origin) and remaps this page's own colors to it.
 * Opened outside Home Assistant it does nothing, so the page keeps its own look.
 * Wallpaper, first match wins: the add-on's own "wallpaper" option (Configuration tab), then the
 * shared add-on wallpaper picked in Photo Hub (/local/addon-wallpaper/wallpaper.json), then the theme's.
 * The add-on option:
 *   empty = use the theme's wallpaper, "none" = no wallpaper, or an image:
 *   /local/pic.jpg (= /config/www/pic.jpg), just pic.jpg, /config/www/..., or https://...
 * Opt out on a page: <html data-ha-theme-off>
 * Variables you can use in new pages: --hb-bg --hb-card --hb-text --hb-text2 --hb-line
 * --hb-primary --hb-accent --hb-on --hb-error --hb-warning --hb-success --hb-field,
 * plus every core HA variable (--primary-color, --card-background-color, ...).
 */
(function () {
  'use strict';
  if (window.__haThemeBridge) return;
  window.__haThemeBridge = 1;
  var doc = document, root = doc.documentElement;
  if (root.hasAttribute('data-ha-theme-off')) return;

  /* ---------- find the Home Assistant window above us ---------- */
  var HA = null;
  try {
    var w = window;
    while (w.parent && w.parent !== w) {
      w = w.parent;
      if (w.document && w.document.querySelector('home-assistant')) HA = w;
    }
  } catch (e) { /* cross-origin parent: stop climbing */ }
  if (!HA) return;
  var nested = window.parent !== HA;

  /* ---------- color helpers ---------- */
  function parse(c) {
    if (!c) return null;
    c = String(c).trim().toLowerCase();
    var m;
    if (c.charAt(0) === '#') {
      var h = c.slice(1);
      if (!/^[0-9a-f]+$/.test(h)) return null;
      if (h.length === 3 || h.length === 4) h = h.replace(/./g, '$&$&');
      if (h.length !== 6 && h.length !== 8) return null;
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16),
        h.length === 8 ? parseInt(h.slice(6, 8), 16) / 255 : 1];
    }
    if ((m = c.match(/^rgba?\(([^)]+)\)$/))) {
      var p = m[1].split(/[\s,\/]+/).filter(Boolean);
      if (p.length < 3) return null;
      var f = function (v, alpha) {
        return /%$/.test(v) ? parseFloat(v) * (alpha ? 0.01 : 2.55) : parseFloat(v);
      };
      var out = [f(p[0]), f(p[1]), f(p[2]), p.length > 3 ? f(p[3], 1) : 1];
      for (var i = 0; i < 4; i++) if (isNaN(out[i])) return null;
      return out;
    }
    if (c === 'white') return [255, 255, 255, 1];
    if (c === 'black') return [0, 0, 0, 1];
    if (c === 'transparent') return [0, 0, 0, 0];
    return null;
  }
  function info(c) {
    var r = c[0] / 255, g = c[1] / 255, b = c[2] / 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b), ch = mx - mn, h = 0;
    if (ch) {
      if (mx === r) h = ((g - b) / ch) % 6;
      else if (mx === g) h = (b - r) / ch + 2;
      else h = (r - g) / ch + 4;
      h *= 60;
      if (h < 0) h += 360;
    }
    return { l: (mx + mn) / 2, ch: ch, h: h, a: c[3] };
  }
  /* greys, plus the dark navy/indigo shades many dark UIs use as their "grey" */
  function isNeutral(i) {
    return i.ch < 0.12 || (i.ch < 0.2 && i.h >= 200 && i.h <= 290 && (i.l < 0.32 || i.l > 0.85));
  }
  function lum(c) { return c ? (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255 : 0; }
  function rgbStr(c) { return Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]); }
  function hueRole(h) {
    return (h < 15 || h >= 335) ? 'error' : h < 65 ? 'warning' : h < 170 ? 'success' : 'primary';
  }
  function tint(role, a) { return 'rgba(var(--hb-' + role + '-rgb),' + (Math.round(a * 1000) / 1000) + ')'; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  var probe = null;
  function toRGB(v) {
    v = (v || '').trim();
    if (!v) return null;
    var p = parse(v);
    if (p) return p;
    if (!probe) {
      probe = doc.createElement('i');
      probe.style.display = 'none';
      (doc.body || root).appendChild(probe);
    }
    probe.style.color = '';
    probe.style.color = v;
    if (!probe.style.color) return null;
    return parse(getComputedStyle(probe).color);
  }

  /* ---------- what the page looked like before we touched it ---------- */
  var REFS = { dark: { b: 0.08, t: 0.92 }, light: { b: 0.96, t: 0.12 } };
  var designScheme = 'dark';
  (function measure() {
    var el = doc.body || root, cs = getComputedStyle(el);
    var txt = parse(cs.color), bg = parse(cs.backgroundColor);
    if (!bg || bg[3] < 0.5) bg = parse(getComputedStyle(root).backgroundColor);
    if (txt) designScheme = info(txt).l > 0.5 ? 'dark' : 'light';

  function openSession(win, sess, finished) {

    const enter = h('button', { class: 'b', type: 'button', title: 'Press Enter in the window', onclick: act(async () => paint(await api(`sessions/${sess.id}/input`, { method: 'POST', json: { text: '' } }))) }, 'Enter ⏎');

      const seg = h('span', { class: 'seg' });
      const drawSeg = () => seg.replaceChildren(...ACCESS.map(([v, l]) => h('button', { type: 'button', 'aria-pressed': access === v, onclick: () => { access = v; drawSeg(); explain(); } }, l)));
      const why = h('p', { class: 'muted' });
      const explain = () => why.textContent = { read: 'System info (CPU, memory, disks, Docker containers), list, read and search files. Nothing can be changed.', files: 'Everything in Look only, plus creating and changing files.', full: 'Everything, plus running any shell command as that user (restart containers, update, install…). The folder limit below then only applies to the file tools, since a command can go anywhere the user can.' }[access];
      drawSeg(); explain();
      const folders = h('textarea', { placeholder: 'One per line, e.g.\n~/docker\n/opt/stacks\n(empty = everywhere the user can go)' }, (srv.folders || []).join('\n'));
      body.append(...field('Computer', comp), h('label', { class: 'f' }, 'What the AI may do'), seg, why, ...field('Only these folders', folders));
      Object.defineProperties(spec, Object.getOwnPropertyDescriptors({ get computer() { return comp.value; }, get access() { return access; }, get folders() { return folders.value; } }));
    } else if (kind === 'command') {
      const cmd = h('textarea', { placeholder: 'npx -y @modelcontextprotocol/server-filesystem /share', style: 'min-height:60px' }, srv.command || '');
      const runOn = h('select', {}, h('option', { value: 'gateway', selected: srv.run_on === 'gateway' }, 'Inside the gateway'), ...compOpts(srv.run_on));
      const env = h('textarea', { placeholder: 'GITHUB_PERSONAL_ACCESS_TOKEN=...\n(one NAME=value per line, optional)' }, Object.entries(srv.env || {}).map(([k, v]) => `${k}=${v}`).join('\n'));
      body.append(...field('Command that starts the MCP server (stdio)', cmd),
        h('p', { class: 'muted' }, 'Any MCP server that talks over stdin/stdout. Examples: npx -y @modelcontextprotocol/server-memory · npx -y @modelcontextprotocol/server-filesystem ~/projects · docker run -i --rm mcp/fetch · uvx mcp-server-git (on a computer that has uv).'),
        ...field('Run it on', runOn),
        h('p', { class: 'muted' }, 'Inside the gateway it runs as a limited user with Node.js (npx) available. On a computer it runs over SSH as that computer’s user, with its own PATH, so it can use anything installed there.'),
        ...field('Environment variables', env));
      Object.defineProperties(spec, Object.getOwnPropertyDescriptors({ get command() { return cmd.value; }, get run_on() { return runOn.value; }, get env() { return env.value; } }));
    } else if (kind === 'remote') {
      const u = h('input', { value: srv.url || '', placeholder: 'https://example.com/mcp' });
      const hd = h('textarea', { placeholder: 'Authorization: Bearer ...\n(one Name: value per line, optional)' }, Object.entries(srv.headers || {}).map(([k, v]) => `${k}: ${v}`).join('\n'));
      body.append(...field('MCP server URL (Streamable HTTP)', u), ...field('Headers', hd),
        h('p', { class: 'muted' }, 'For servers that use a fixed token or none. Servers that need an OAuth sign-in in the browser can’t be wrapped this way.'));
      Object.defineProperties(spec, Object.getOwnPropertyDescriptors({ get url() { return u.value; }, get headers() { return hd.value; } }));
    }
    const save = async () => { const j = { id: srv.id, name: name.value }; for (const k of Object.keys(spec)) j[k] = spec[k]; return api('mcp/servers', { method: 'POST', json: j }); };
    const toolsBox = h('div');
    const test = async () => {
      toolsBox.replaceChildren(h('p', { class: 'muted' }, kind === 'command' ? 'Starting it (the first npx run can take a minute)…' : 'Connecting…'));
      const r = await api(`mcp/servers/${srv.id}/check`, { method: 'POST' });
      const hidden = new Set(srv.hidden_tools || []);
      const rows = (r.tools || []).map(t => {
        const cb = h('input', { type: 'checkbox', checked: !hidden.has(t.name) });
        cb.onchange = () => cb.checked ? hidden.delete(t.name) : hidden.add(t.name);
        return h('label', { class: 'keyrow', style: 'align-items:flex-start' }, cb, h('span', { class: 'grow' }, h('span', { class: 'mono' }, t.name), h('br'), h('span', { class: 'muted' }, t.description || '')));
      });
      toolsBox.replaceChildren(
        h('div', { class: r.ok ? 'note' : 'note err' }, r.ok ? `Working ✓ ${r.reply || ''}${r.ms ? ` (${r.ms} ms)` : ''} · ${(r.tools || []).length} tools` : (r.error || 'Failed')),
        r.log && r.log.length ? h('details', {}, h('summary', { class: 'muted' }, 'Server log'), h('pre', { class: 'term' }, r.log.join('\n'))) : null,
        rows.length ? h('div', {}, h('h2', {}, 'Tools the AI gets (untick to hide)'), ...rows,
          h('button', { class: 'b p', type: 'button', style: 'margin-top:8px', onclick: act(async () => { await api('mcp/servers', { method: 'POST', json: { id: srv.id, hidden_tools: [...hidden] } }); srv.hidden_tools = [...hidden]; toast('Saved'); }) }, 'Save tools')) : null);
    };
    body.append(h('div', { class: 'row', style: 'position:sticky;bottom:0;background:var(--panel);padding:8px 0' },
      h('button', { class: 'b p', type: 'button', onclick: act(async () => { Object.assign(srv, await save()); toast('Saved'); await test(); }) }, 'Save & test'),
      h('button', { class: 'b', type: 'button', onclick: act(test) }, 'Test'),
      h('button', { class: 'b', type: 'button', onclick: () => { openPicker = ''; show(); } }, 'Close')), toolsBox);
    return body;
  }

  // ------------------------------------------------------------ models (host your own AI)
  async function models(root) {
    clearInterval(timer);
    const body = h('div');
    const sub = h('div', { class: 'sub' }, [['installed', 'Installed'], ['find', 'Find & download'], ['jobs', 'Downloads']].map(([id, l]) =>
      h('button', { type: 'button', 'aria-pressed': id === modelsTab, onclick: () => { modelsTab = id; models(root); } }, l)));
    root.replaceChildren(sub, body);
    if (!S.ollama.ok) body.append(h('div', { class: 'note' }, S.ollama.error, ' ', h('button', { class: 'b', type: 'button', onclick: () => { tab = 'settings'; show(); } }, 'Open settings')));
    await ({ installed, find, jobs }[modelsTab])(body, root);
  }

  async function installed(body) {
    if (!S.ollama.ok) return;
    const { models: list } = await api('models/installed');
    if (S.disk_free != null) body.append(h('p', { class: 'muted' }, 'Free disk space for models: ' + mb(S.disk_free)));
    body.append(list.length ? list.map(m => h('div', { class: 'card' },
      h('div', { class: 'row sp' }, h('h3', {}, lamp(m.loaded ? 'ready' : 'off'), h('span', { class: 'mono' }, m.name)),
        h('span', { class: 'muted' }, m.size_h)),
      h('div', { class: 'row' }, m.params ? h('span', { class: 'chip' }, m.params) : null, m.quant ? h('span', { class: 'chip' }, m.quant) : null, m.family ? h('span', { class: 'chip' }, m.family) : null,
        h('span', { class: 'muted' }, m.loaded ? 'in memory' : 'on disk')),
      h('div', { class: 'row', style: 'margin-top:8px' },
        h('button', { class: 'b', type: 'button', disabled: !m.loaded, onclick: act(async () => { await api('models/unload', { method: 'POST', json: { name: m.name } }); toast('Unloaded'); show(); }) }, 'Free memory'),
        h('button', { class: 'b d', type: 'button', onclick: act(async () => { if (!confirm(`Delete ${m.name}? ${m.size_h} will be freed.`)) return; await api('models/delete', { method: 'POST', json: { name: m.name } }); show(); }) }, 'Delete'))))
      : h('p', { class: 'muted' }, 'No models downloaded yet. Use “Find & download”.'));
  }

  async function startPull(name) {
    await api('models/pull', { method: 'POST', json: { name } });
    toast('Download started'); modelsTab = 'jobs'; show();
  }

  async function find(body) {
    const q = h('input', { type: 'search', placeholder: 'Search models, e.g. llama, qwen, gemma, coder', enterkeyhint: 'search' });
    const src = h('select', {}, [['all', 'Ollama library + Hugging Face'], ['ollama', 'Ollama library only'], ['hf', 'Hugging Face (GGUF) only']].map(([v, l]) => h('option', { value: v }, l)));
    const results = h('div'), byName = h('input', { placeholder: 'or type an exact name: llama3.1:8b, hf.co/user/repo:Q4_K_M' });
    const run = act(async () => {
      results.replaceChildren(h('p', { class: 'muted' }, 'Searching…'));
      const r = await api(`models/search?q=${encodeURIComponent(q.value)}&source=${src.value}`);
      results.replaceChildren(...r.notes.map(n => h('p', { class: 'muted' }, n)),
        ...(r.results.length ? r.results.map(resultCard) : [h('p', { class: 'muted' }, 'No matches. Try another word, or download by exact name above.')]));
    });
    q.onkeydown = e => { if (e.key === 'Enter') run(); };
    body.append(
      h('div', { class: 'card' }, h('div', { class: 'row' }, h('div', { class: 'grow' }, q), h('button', { class: 'b p', type: 'button', onclick: run }, 'Search')), h('div', { style: 'margin-top:8px' }, src)),
      h('div', { class: 'card' }, h('div', { class: 'row' }, h('div', { class: 'grow' }, byName),
        h('button', { class: 'b p', type: 'button', onclick: act(() => startPull(byName.value)) }, 'Download'))),
      results);
    run();
  }

  function resultCard(r) {
    const quants = h('div');
    const pulls = r.source === 'hf'
      ? h('button', { class: 'b', type: 'button', onclick: act(async () => {
          const { quants: qs } = await api('models/quants?repo=' + encodeURIComponent(r.id));
          quants.replaceChildren(...(qs.length ? qs.map(x => h('div', { class: 'keyrow' }, h('span', { class: 'mono grow' }, x.quant), h('span', { class: 'muted' }, x.size_h),
            h('button', { class: 'b p', type: 'button', onclick: act(() => startPull(x.pull)) }, 'Download'))) : [h('p', { class: 'muted' }, 'No GGUF files found.')]));
        }) }, 'Pick a quantisation')
      : h('div', { class: 'row' }, ...r.pull.map((n, i) => h('button', { class: 'b p', type: 'button', onclick: act(() => startPull(n)) }, 'Download ' + (r.sizes[i] || 'latest'))));
    return h('div', { class: 'card' },
      h('h3', {}, h('span', { class: 'mono' }, r.title), h('span', { class: 'chip' }, r.source === 'hf' ? 'Hugging Face' : 'Ollama')),
      r.description ? h('p', { class: 'muted', style: 'margin:0 0 6px' }, r.description) : null,
      h('div', { class: 'row', style: 'margin-bottom:8px' }, ...r.capabilities.map(c => h('span', { class: 'chip' }, c)),
        r.downloads ? h('span', { class: 'muted' }, r.downloads + ' downloads') : null, r.updated ? h('span', { class: 'muted' }, r.updated) : null),
      pulls, quants);
  }

  const meter = pct => h('div', { class: 'meter', role: 'progressbar', 'aria-valuenow': Math.round(pct), 'aria-valuemin': 0, 'aria-valuemax': 100 },
    Array.from({ length: 20 }, (_, i) => h('i', { class: i < Math.round(pct / 5) ? 'on' : '' })));

  async function jobs(body) {
    const draw = async () => {
      const { jobs: list } = await api('jobs');
      body.replaceChildren(...(list.length ? list.map(j => {
        const pct = j.total ? j.completed / j.total * 100 : (j.status === 'done' ? 100 : 0);
        return h('div', { class: 'card' },
          h('div', { class: 'row sp' }, h('span', { class: 'mono' }, j.name), h('span', { class: j.status === 'error' ? 'err' : j.status === 'done' ? 'ok' : 'muted' }, j.status)),
          meter(pct),
          h('div', { class: 'row sp muted' }, h('span', {}, j.total ? `${mb(j.completed)} of ${mb(j.total)}` : j.message), h('span', {}, j.total ? (pct >= 99.5 && pct < 100 ? '99%' : Math.round(pct) + '%') : '')),
          j.status === 'pulling' && j.total ? h('div', { class: 'muted' }, 'Step: ' + (j.message || '…') + ' · last news ' + ago(j.updated) + ' ago') : null,
          j.status === 'error' ? h('p', { class: 'err' }, j.message) : null,
          ['queued', 'pulling'].includes(j.status) ? h('button', { class: 'b d', type: 'button', onclick: act(async () => { await api(`jobs/${j.id}/cancel`, { method: 'POST' }); draw(); }) }, 'Cancel') : null);
      }) : [h('p', { class: 'muted' }, 'No downloads yet.')]));
    };
    await draw();
    refreshEvery(1500, () => draw().catch(() => {}));
  }

  // ------------------------------------------------------------ routes
  async function routes(root) {
    const { models: all } = await api('all-models');
    const rows = Object.entries(S.routes).map(([k, v]) => [k, v.join('\n')]);
    const box = h('div');
    const draw = () => box.replaceChildren(...rows.map((r, i) => {
      const nm = h('input', { value: r[0], placeholder: 'route name, e.g. fast' }); nm.oninput = () => { r[0] = nm.value; };
      const ta = h('textarea', { placeholder: 'one model per line, tried in order' }); ta.value = r[1]; ta.oninput = () => { r[1] = ta.value; };
      const pick = h('select', {}, [h('option', { value: '' }, 'Add a model…'), ...all.filter(m => m.provider !== 'route').map(m => h('option', { value: m.id }, m.id))]);
      pick.onchange = () => { if (pick.value) { ta.value = (ta.value.trim() + '\n' + pick.value).trim(); r[1] = ta.value; pick.value = ''; } };
      return h('div', { class: 'card' }, nm, h('div', { style: 'height:8px' }), ta, h('div', { class: 'row', style: 'margin-top:8px' }, h('div', { class: 'grow' }, pick),
        h('button', { class: 'b d', type: 'button', onclick: () => { rows.splice(i, 1); draw(); } }, 'Remove')));
    }));
    draw();
    root.append(h('p', { class: 'muted' }, 'A route is a model name of your own. Requests try its models in order, so when one provider is down or out of quota the next one answers. Use the route name as the model in any app.'),
      box, h('div', { class: 'row' },
        h('button', { class: 'b', type: 'button', onclick: () => { rows.push(['', '']); draw(); } }, 'Add route'),
        h('button', { class: 'b p', type: 'button', onclick: act(async () => { await api('routes', { method: 'PUT', json: Object.fromEntries(rows.filter(r => r[0].trim()).map(r => [r[0].trim(), r[1]])) }); toast('Routes saved'); }) }, 'Save routes')));
  }

  // ------------------------------------------------------------ chat playground
  async function chatTab(root) {
    const O = S.open_webui || {};
    if (O.installed) {
      const url = O.url || (O.port ? `${location.protocol === 'https:' ? 'http:' : location.protocol}//${location.hostname}:${O.port}` : '');
      const canEmbed = url && !(location.protocol === 'https:' && url.startsWith('http:'));
      root.append(h('div', { class: 'card hero' },
        h('div', { class: 'row sp' }, h('h3', {}, lamp(O.running ? 'ready' : 'off'), 'Open WebUI'),
          url && O.running ? h('a', { class: 'b p', href: url, target: '_blank', rel: 'noopener' }, 'Open in a new tab ↗') : null),
        !O.running ? h('p', { class: 'muted' }, 'The Open WebUI add-on is installed but not running. Start it from its add-on page.')
          : !url ? h('p', { class: 'muted' }, 'Give the Open WebUI add-on a port on its Configuration → Network section to open it here.')
          : h('p', { class: 'muted' }, 'Already connected to this gateway: every model and route here shows up in it. The first account you create there is the admin.')),
        O.running && canEmbed ? h('iframe', { class: 'owui', src: url, title: 'Open WebUI', allow: 'clipboard-write; microphone' }) : null,
        O.running && url && !canEmbed ? h('p', { class: 'muted' }, 'Home Assistant is on https and Open WebUI on http, so the browser won’t show it inside this page. Use the button above.') : null);
    } else if (S.addon) {
      root.append(h('div', { class: 'card hero' }, h('h3', {}, 'Get a full chat app'),
        h('p', { class: 'muted' }, 'Install the ', h('b', {}, 'Open WebUI'), ' add-on from this same add-on repository. It connects to this gateway by itself (no keys to copy) and gives you a ChatGPT-style app with history, file uploads and every model here.'),
        O.slug ? h('button', { class: 'b p', type: 'button', onclick: () => { window.top.location.href = '/hassio/addon/' + O.slug + '/info'; } }, 'Open the Open WebUI add-on page') : null));
    }
    const quick = h('div');
    root.append(O.installed ? h('details', { class: 'card' }, h('summary', {}, h('b', {}, 'Quick test chat')), quick) : quick);
    root = quick;
    const { models: all } = await api('all-models');
    const sel = h('select', {}, all.map(m => h('option', { value: m.id }, m.id)));
    sel.value = sessionStorage.getItem('gw-model') && all.some(m => m.id === sessionStorage.getItem('gw-model')) ? sessionStorage.getItem('gw-model') : (all[0]?.id || '');
    sel.onchange = () => sessionStorage.setItem('gw-model', sel.value);
    const log = h('div', { id: 'chatlog' }), input = h('textarea', { placeholder: 'Message', style: 'min-height:60px;font-family:var(--sans)' });
    const draw = () => log.replaceChildren(...chat.map(m => h('div', { class: 'm ' + (m.role === 'user' ? 'u' : 'a') }, m.content)));
    const send = act(async () => {
      const text = input.value.trim(); if (!text || !sel.value) return;
      input.value = ''; chat.push({ role: 'user', content: text }); const reply = { role: 'assistant', content: '' }; chat.push(reply); draw();
      const r = await api('playground', { method: 'POST', json: { model: sel.value, stream: true, messages: chat.slice(0, -1) }, raw: true });
      if (!r.ok) { const j = await r.json().catch(() => ({})); reply.content = '⚠ ' + (j.error?.message || j.error || r.statusText); return draw(); }
      const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '';
      for (;;) {
        const { done, value } = await rd.read(); if (done) break;
        buf += dec.decode(value, { stream: true });
        let i; while ((i = buf.indexOf('\n\n')) >= 0) {
          const line = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
          if (!line.startsWith('data:') || line.endsWith('[DONE]')) continue;
          try { const j = JSON.parse(line.slice(5)); reply.content += j.choices?.[0]?.delta?.content || ''; if (j.error) reply.content += '⚠ ' + j.error.message; } catch (e) {}
        }
        draw();
      }
      if (!reply.content) reply.content = '(empty reply)'; draw();
    });
    root.append(...field('Model', sel), log, input,
      h('div', { class: 'row', style: 'margin-top:8px' }, h('button', { class: 'b p', type: 'button', onclick: send }, 'Send'),
        h('button', { class: 'b', type: 'button', onclick: () => { chat.length = 0; draw(); } }, 'Clear')));
    draw();
  }

  // ------------------------------------------------------------ settings
  async function settings(root) {
    const s = S.settings, locked = k => S.env_locked.includes(k);
    const rot = h('select', {}, [['balanced', 'Balanced: spread requests across keys'], ['sequential', 'Sequential: stick to one key until it fails']].map(([v, l]) => h('option', { value: v, selected: v === s.rotation }, l)));
    const cool = h('input', { value: s.cooldowns.join(', ') }), to = h('input', { type: 'number', value: s.timeout_s });
    const ou = h('input', { value: s.ollama_url, disabled: locked('ollama_url'), placeholder: 'http://192.168.1.50:11434' }), pre = h('textarea', { disabled: locked('ollama_preload') }); pre.value = s.ollama_preload;
    root.append(
      h('div', { class: 'card' }, h('h3', {}, 'Proxy key'), h('p', { class: 'muted' }, 'Apps send this as their API key. Changing it signs out every app until you update them.'),
        h('div', { class: 'row' },
          h('button', { class: 'b', type: 'button', onclick: () => copy(S.proxy_key) }, 'Copy'),
          h('button', { class: 'b d', type: 'button', onclick: act(async () => { if (!confirm('Create a new key? Apps using the old one will stop working.')) return; await api('proxy-key/regenerate', { method: 'POST' }); toast('New key created'); show(); }) }, 'Generate a new key'))),
      h('div', { class: 'card' }, h('h3', {}, 'Key rotation'),
        ...field('Default mode', rot), ...field('Rest times after repeated failures (seconds, in order)', cool), ...field('Wait for a provider (seconds)', to)),
      h('details', { class: 'card', open: S.ollama.configured || null }, h('summary', {}, h('b', {}, 'Ollama (optional)'), h('span', { class: 'muted' }, S.ollama.configured ? ' · ' + S.ollama.url : ' · not used')),
        h('p', { class: 'muted' }, 'Only if you run Ollama somewhere (another PC, a NAS…). Leave the address empty and nothing about Ollama shows up anywhere.'),
        ...field(locked('ollama_url') ? 'Ollama address (set by the OLLAMA_URL environment variable)' : 'Ollama address (LAN address of the machine running Ollama)', ou),
        h('button', { class: 'b', type: 'button', onclick: act(async () => { const r = await api('ollama/test', { method: 'POST', json: { url: ou.value } }); r.ok ? toast('Connected: Ollama ' + r.version) : toast(r.error, true); }) }, 'Test connection'),
        ...field(locked('ollama_preload') ? 'Download on start (set by the OLLAMA_PRELOAD environment variable)' : 'Download on start (comma-separated names)', pre)),
      h('button', { class: 'b p', type: 'button', onclick: act(async () => {
        await api('settings', { method: 'PUT', json: { rotation: rot.value, cooldowns: cool.value.split(',').map(x => x.trim()).filter(Boolean), timeout_s: to.value, ollama_url: ou.value, ollama_preload: pre.value } });
        toast('Saved'); show(); }) }, 'Save settings'),
      AUTH.ingress ? null : h('div', { class: 'card' }, h('h3', {}, 'Signed in'),
        h('p', { class: 'muted' }, `This device stays signed in. ${S.sessions} device${S.sessions === 1 ? '' : 's'} signed in right now.`),
        h('div', { class: 'row' },
          h('button', { class: 'b', type: 'button', onclick: act(async () => { await api('logout', { method: 'POST' }); showLogin(); }) }, 'Sign out'),
          h('button', { class: 'b d', type: 'button', onclick: act(async () => { if (!confirm('Sign out every phone and computer, including this one?')) return; await api('logout-all', { method: 'POST' }); showLogin(); }) }, 'Sign out everywhere'))),
      h('p', { class: 'muted' }, `Up ${Math.round(S.uptime_s / 60)} min`));
  }

  // ------------------------------------------------------------ sign-in
  let AUTH = { ingress: false };
  function showLogin(msg) {
    clearInterval(timer);
    document.body.classList.add('signed-out');
    $('#login').hidden = false;
    $('#loginerr').textContent = msg || '';
    if (AUTH.separate_password === false) $('#loginhint').textContent = 'Use your proxy key as the password (or set an admin password in the add-on options).';
    setTimeout(() => $('#pw').focus(), 50);
  }
  $('#pwshow').onclick = () => { const p = $('#pw'); const show = p.type === 'password'; p.type = show ? 'text' : 'password'; $('#pwshow').textContent = show ? 'Hide' : 'Show'; };
  $('#loginform').onsubmit = async ev => {
    ev.preventDefault();
    const btn = $('#loginbtn'); btn.disabled = true; $('#loginerr').textContent = '';
    try {
      const r = await fetch('api/login', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: $('#pw').value, remember: $('#remember').checked }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || 'Sign-in failed');
      $('#pw').value = ''; $('#login').hidden = true; document.body.classList.remove('signed-out');
      show();
    } catch (e) { $('#loginerr').textContent = e.message; $('#pw').select(); }
    finally { btn.disabled = false; }
  };
  (async () => {
    try { AUTH = await (await fetch('api/auth', { credentials: 'same-origin' })).json(); } catch (e) {}
    if (AUTH.signed_in) show(); else showLogin();
  })();
})();
</script>
</body>
